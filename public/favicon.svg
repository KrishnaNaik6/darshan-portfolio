<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#040405"/>
    </linearGradient>

    <!-- Amber Gold Glow Gradient -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Secondary Accent Gradient -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Subtle Inner Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ambient" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="36" result="blur"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Ring -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#27272a" stroke-width="6"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#amberGlow)" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Ambient Amber Glow behind monogram -->
  <circle cx="256" cy="256" r="140" fill="#f59e0b" opacity="0.18" filter="url(#ambient)"/>

  <!-- Geometric Monogram "D" + Cinematic Prism -->
  <g transform="translate(116, 106)">
    <!-- Outer Curved "D" Stem and Arc -->
    <path d="M 0,20 
             C 0,8.954 8.954,0 20,0 
             L 130,0 
             C 218.366,0 280,61.634 280,150 
             C 280,238.366 218.366,300 130,300 
             L 20,300 
             C 8.954,300 0,291.046 0,280 
             Z" 
          fill="none" 
          stroke="url(#amberGlow)" 
          stroke-width="36" 
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#glow)"/>

    <!-- Inner Cinematic Play Wedge / Prism Beam -->
    <path d="M 76,82 
             L 174,150 
             L 76,218 
             Z" 
          fill="url(#goldHighlight)" 
          stroke="url(#amberGlow)" 
          stroke-width="8"
          stroke-linejoin="round"/>

    <!-- Subtle Cinematic Film Spark / Diamond Node -->
    <polygon points="214,150 226,138 238,150 226,162" fill="#fef08a"/>
  </g>
</svg>
